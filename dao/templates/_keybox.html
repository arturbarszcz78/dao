<div class="keybox" id="keybox">
  <div id="keystatus">Checking signer…</div>
  <form id="keyform" hidden class="row" style="margin-top:8px">
    <input type="text" id="seed" placeholder="64-hex ed25519 seed (stays in this tab)" autocomplete="off" style="flex:1; min-width:280px">
    <button type="submit">Load key</button>
  </form>
  <button id="keyforget" hidden class="ghost" style="margin-top:8px">Forget key</button>
  <div id="keymsg" class="msg" hidden></div>
</div>
